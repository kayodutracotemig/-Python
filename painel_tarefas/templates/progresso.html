{% extends "base.html" %}
{% block conteudo %}
<h2>Progresso das tarefas</h2>
<div style="max-width: 500px;">
    <canvas id="graficoProgresso"></canvas>
</div>
{% endblock %}

{% block script %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>

fetch("/api/progresso")
    .then(resp => resp.json())
    .then(dados => {
        const ctx = document.getElementById("graficoProgresso");
        new Chart(ctx, {
            type: "pie",
            data: {
                labels: ["Pendente", "Em andamento", "Concluída"],
                datasets: [{
                    data: [dados.pendente, dados.em_andamento, dados.concluida],
                    backgroundColor: ["#ffc107", "#0d6efd", "#198754"]
                }]
            }
        });
    });
</script>
{% endblock %}
