<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel de Tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">
                <i class="bi bi-check2-square"></i> Painel de Tarefas
            </a>
            {% if session.get('usuario_id') %}
            <div class="d-flex align-items-center gap-2">
                <span class="navbar-text text-light">Olá, {{ session.get('usuario_nome') }}</span>
                <a href="{{ url_for('progresso') }}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-bar-chart"></i> Progresso
                </a>
                <button id="btnModoEscuro" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-moon-stars"></i>
                </button>
                <a href="{{ url_for('logout') }}" class="btn btn-outline-danger btn-sm">Sair</a>
            </div>
            {% endif %}
        </div>
    </nav>

    <div class="container mt-4">
        {% block conteudo %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
       
        const btnModo = document.getElementById("btnModoEscuro");
        const raiz = document.documentElement;

        function aplicarModo(modo) {
            raiz.setAttribute("data-bs-theme", modo);
        }

        const modoSalvo = localStorage.getItem("modo") || "light";
        aplicarModo(modoSalvo);

        if (btnModo) {
            btnModo.addEventListener("click", () => {
                const modoAtual = raiz.getAttribute("data-bs-theme");
                const novoModo = modoAtual === "dark" ? "light" : "dark";
                aplicarModo(novoModo);
                localStorage.setItem("modo", novoModo);
            });
        }
    </script>
    {% block script %}{% endblock %}
</body>
</html>
